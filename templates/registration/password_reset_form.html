{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-2">Forgot password</h1>
  <p class="text-sm text-gray-500 mb-6">Enter your email and we will send a reset link. (In development the email appears in the terminal running the server.)</p>
  <form method="post">{% csrf_token %}
    <input type="email" name="email" required placeholder="you@example.com" class="w-full rounded-lg border border-gray-300 px-4 py-2 mb-4 focus:border-orange-500 outline-none">
    <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg">Send reset link</button>
  </form>
</div>
{% endblock %}
