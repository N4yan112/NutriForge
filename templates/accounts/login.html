{% extends 'base.html' %}
{% block title %}Login – NutriForge{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-6">Login</h1>
  <form method="post">
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg">Login</button>
  </form>
  <p class="text-sm mt-4"><a href="{% url 'password_reset' %}" class="text-orange-600">Forgot password?</a></p>
  <p class="text-sm mt-2">New here? <a href="{% url 'register' %}" class="text-orange-600">Create an account</a></p>
</div>
{% endblock %}
